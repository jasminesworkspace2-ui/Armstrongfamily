<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone layout review</title><style>body{margin:0;background:#292724;color:#f3eadd;font:16px Arial}header{padding:12px;display:flex;gap:12px;align-items:center}button,select{padding:10px;font-size:16px}iframe{display:block;width:390px;height:780px;margin:10px auto;border:1px solid #85745c;background:#0c0b09}</style></head><body><header><label>Page <select id="page"><option>welcome.html</option><option>start_here.html</option><option>family_tree.html</option><option>papertrail.html</option><option>research_archive.html</option><option>enslaver_estate_network_prototype.html</option><option>photos.html</option><option>methodology.html</option><option>familytime.html</option></select></label><button data-width="320">320</button><button data-width="390">390</button><button data-width="430">430</button><span>Phone-width walkthrough</span></header><iframe id="phone" name="phone" title="Phone website preview" src="welcome.html"></iframe><script>const frame=document.getElementById("phone");document.getElementById("page").onchange=e=>frame.src=e.target.value;document.querySelectorAll("[data-width]").forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+"px");</script></body></html>
